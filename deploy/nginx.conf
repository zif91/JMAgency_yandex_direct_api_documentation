server {
    listen 80;
    server_name direct.jmagency.ru;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name direct.jmagency.ru;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/direct.jmagency.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/direct.jmagency.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running report requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Maximum upload size
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/direct.jmagency.ru.access.log;
    error_log /var/log/nginx/direct.jmagency.ru.error.log;
}
